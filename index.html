 pubpack(d){PACKS[+d.i].ids.forEach(id=>{if(!P.cart.includes(id))P.cart.push(id)});renderPublic();ACT.pubform()},
 pubform(){
  const items=P.cart.map(sv).filter(Boolean),tot=sum(items.map(x=>x.p));
  modal('Enviar consulta',`<form data-form="pubconsulta"><div class="rec" style="margin-bottom:12px">${items.length?items.map(x=>`<div class="stat"><span>${esc(x.n)}</span><b>${pm(x.p)}</b></div>`).join('')+`<div class="stat"><b>Total estimado</b><b>${ars(tot)}</b></div>`:'<span class="mut">Consulta general: contanos tu caso y te orientamos sin cargo.</span>'}</div><div class="fr"><div><label>Nombre y apellido</label><input name="n" required></div><div><label>WhatsApp</label><input name="tel" required placeholder="387 123 4567"></div><div><label>Email (opcional)</label><input type="email" name="mail"></div></div><div style="margin-top:10px"><label>Contanos tu caso</label><textarea name="msg" rows="3" placeholder="Ej: soy monotributista y quiero empezar a invertir"></textarea></div><p><button class="btn pri">Enviar por WhatsApp</button></p><p class="disc">Se abre WhatsApp con tu consulta lista para enviar. En la versión real también llega al panel del estudio como consulta nueva.</p></form>`);
 },
 svdel(d){const i=SERV.findIndex(x=>x.id===+d.id);if(i>=0)SERV.splice(i,1);toast('Servicio eliminado del menú');render()},
 leadst(d){const l=LEADS.find(x=>x.id===+d.id);if(l&&(l.est==='Nueva'||d.e==='Descartada'))l.est=d.e;setTimeout(render,0)},
 leadcli(d){
  const l=LEADS.find(x=>x.id===+d.id);if(!l||l.est==='Cliente')return;
  const mono=l.serv.includes(6),soc=l.serv.includes(9),inv=l.serv.some(i=>i===10||i===11||i===12);
  const c={id:NEXTCL++,n:l.n,cuit:'20-'+(30000000+l.id*137)+'-'+(l.id%9),tipo:mono?'Monotributo':soc?'Sociedad':inv&&!l.serv.some(i=>i<10)?'Persona humana':'Responsable Inscripto',resp:inv?3:1,hon:sum(l.serv.map(i=>sv(i)&&/mes/.test(sv(i).u)?sv(i).p:0))||60000,emp:0,serv:l.serv.map(i=>sv(i)?sv(i).n:'').filter(Boolean).slice(0,3),tel:l.tel,mail:l.mail||'—'};
  c.det=c.tipo+' · Alta desde el sitio web';if(mono){c.cat='A';c.fac12=0}if(inv){c.inv=true;PF[c.id]={ars:0,usd:0,pos:[],real:0}}
  CL.push(c);vencClient(c).forEach(v=>VEN.push(v));factClient(c).forEach(x=>FACT.push(x));VEN.sort((a,b)=>a.fecha<b.fecha?-1:1);
  l.est='Cliente';toast('Cliente creado con vencimientos y honorarios ✔');render();
 }
});
Object.assign(CHG,{
 svon(v,t){sv(t.dataset.id).on=t.checked?1:0;render()},
 svhot(v,t){sv(t.dataset.id).hot=t.checked?1:0;render()},
 svprice(v,t){sv(t.dataset.id).p=Math.max(0,+v||0);toast('Precio actualizado en el sitio ✔');render()}
});
Object.assign(FRM,{
 newserv(f){SERV.push({id:Date.now(),cat:f.get('cat'),n:f.get('n'),d:f.get('d'),p:+f.get('p')||0,u:f.get('u')||'por trámite',on:1});toast('Servicio publicado ✔');render()},
 pubconsulta(f){
  const n=f.get('n'),tel=normTel(f.get('tel')),items=P.cart.map(sv).filter(Boolean),tot=sum(items.map(x=>x.p)),msg=f.get('msg')||'';
  LEADS.unshift({id:LID++,ts:Date.now(),n,tel,mail:f.get('mail'),serv:items.map(x=>x.id),msg:msg||'(sin mensaje)',est:'Nueva'});
  const txt='Hola, soy '+n+'. '+(items.length?'Quiero consultar por: '+items.map(x=>x.n).join(', ')+' (total estimado '+ars(tot)+'). ':'Quiero hacer una consulta. ')+msg;
  closeModal();P.cart=[];renderPublic();toast('¡Consulta registrada! Abriendo WhatsApp…');
  window.open(waLink(STEL,txt),'_blank','noopener');
 }
});

/* ============ Core ============ */
function buildNav(){
 const venPend=VEN.filter(v=>v.estado==='Vencido').length;
 $('#nav').innerHTML=NAV.map(n=>n.length===1?`<div class="grp">${n[0]}</div>`:`<a data-act="go" data-v="${n[0]}" class="${S.view===n[0]?'on':''}"><span>${n[2]}</span>${n[1]}${n[0]==='venc'&&venPend?`<span class="badge b-bad">${venPend}</span>`:''}${n[0]==='sitio'&&LEADS.filter(l=>l.est==='Nueva').length?`<span class="badge b-gold">${LEADS.filter(l=>l.est==='Nueva').length}</span>`:''}</a>`).join('');
 $('#nCount').textContent=alerts().length;
}
function render(){
 CH=[];const sc=window.scrollY;
 $('#view').innerHTML=V[S.view]();buildNav();
 if(S.view==='cart'&&S.tab.cart==='ord')ordPreview();
 runCharts();
}
function go(v){S.view=v;$('#side').classList.remove('open');closeModal();location.hash=v;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act]){ACT[t.dataset.act](t.dataset,t,e)}else if(!e.target.closest('.search'))$('#gsr').hidden=true;if(e.target.id==='modal')closeModal()});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(t&&CHG[t.dataset.chg])CHG[t.dataset.chg](t.value,t,e)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-inp]');if(t&&INP[t.dataset.inp])INP[t.dataset.inp](t.value,t,e)});
document.addEventListener('submit',e=>{const t=e.target.closest('[data-form]');if(t&&FRM[t.dataset.form]){e.preventDefault();FRM[t.dataset.form](new FormData(t),t)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(runCharts,150)});

/* Mercado: ticks simulados */
setInterval(()=>{
 MKT.forEach(m=>{const k=m.c==='FCI'?.0004:m.c==='Bono'||m.c==='ON'?.003:.007;m.p*=1+(Math.random()-.5)*k;m.h.push(m.p);m.h.shift()});
 IDX.merval.v*=1+(Math.random()-.5)*.003;IDX.mep.v*=1+(Math.random()-.5)*.001;IDX.ccl.v*=1+(Math.random()-.5)*.001;IDX.of.v*=1+(Math.random()-.5)*.0004;IDX.rp.v+=(Math.random()-.5)*4;IDX.cau.v+=(Math.random()-.5)*.1;
 if(S.view==='mkt'&&!$('#modal.on')){const b=$('#mktBody');if(b){b.innerHTML=marketTable();$('#idxc').innerHTML=idxCards()}}
 if(S.view==='cart'&&S.tab.cart==='pos'&&!$('#modal.on')){const c=$('#cartLive');if(c){CH=[];c.innerHTML=cartLive(S.cidPf);runCharts()}}
},3000);

render();syncHash();
</script>
